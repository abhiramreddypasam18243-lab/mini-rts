# Serves the Godot web export (SPEC D1, D4, D5).
# Thread support is off in the export, so no cross-origin-isolation headers
# (COOP/COEP) are needed.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # .wasm is mapped to application/wasm by nginx's mime.types; .pck falls back
    # to application/octet-stream.
    default_type application/octet-stream;

    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_types application/javascript text/javascript application/wasm application/octet-stream text/css text/plain;

    # Same-origin only. Godot's page uses an inline start-up script and
    # compiles WebAssembly, hence 'unsafe-inline' and 'wasm-unsafe-eval'.
    # (Tightened with a script hash in build step 10, AC-82.)
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self' blob: data:; worker-src 'self' blob:; object-src 'none'; base-uri 'none'; frame-ancestors 'self'" always;
    add_header X-Content-Type-Options "nosniff" always;

    location = /healthz {
        default_type text/plain;
        access_log off;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
