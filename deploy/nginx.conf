# Serves the Godot web export (SPEC D1, D4, D5).
# Thread support is off in the export, so no cross-origin-isolation headers
# (COOP/COEP) are needed.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # .wasm is mapped to application/wasm by nginx's mime.types; .pck falls back
    # to application/octet-stream.
    default_type application/octet-stream;

    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_types application/javascript text/javascript application/wasm application/octet-stream text/css text/plain;

    # Same-origin only (AC-82). The page's one inline <script> and one inline
    # <style> are allowed by their SHA-256 hashes, computed after each export
    # by tools/csp_hash.gd; 'wasm-unsafe-eval' lets the browser compile the
    # WebAssembly. No 'unsafe-inline'.
    include /etc/nginx/csp.conf;
    add_header X-Content-Type-Options "nosniff" always;

    location = /healthz {
        default_type text/plain;
        access_log off;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
